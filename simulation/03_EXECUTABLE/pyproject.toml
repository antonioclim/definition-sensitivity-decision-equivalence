[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "odsa-econ-protocol"
version = "0.1.0"
description = "Executable frozen protocol for the economic decision layer of Outcome-Definition Sensitivity Analysis"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
